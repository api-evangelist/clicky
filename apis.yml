name: Clicky
description: >-
  Clicky (ClickyPass) was an Argentine fitness-membership startup founded in 2015 in Cordoba by
  Ezequiel Bucai. It offered a single all-access monthly pass ($15-60/mo) that let members build their
  own fitness schedule across a network of gyms, studios and sports centers in Latin America -
  crossfit, zumba, yoga, running and more - on the same aggregator model as ClassPass and Gympass.
  It was backed by 500 Global, Start-Up Chile and Parallel18 (about $125K raised) and was acquired by
  ClassPass on March 2, 2020; founder Ezequiel Bucai joined ClassPass as Head of Partner Development
  for Chile and Argentina. The company no longer operates independently - the clickypass.com domain
  now 301-redirects to classpass.com - and it publishes no public developer API, SDK, or developer
  portal of its own. Retained in the API Evangelist network as an acquired 500 Global portfolio lead.
